packages:
  - apps/*
  - packages/*
  - templates/*

catalog:
  "@astrojs/check": 0.9.10
  "@astrojs/sitemap": 3.7.3
  "@fontsource-variable/inter": 5.2.8
  "@tailwindcss/vite": 4.3.3
  astro: 7.2.2
  prettier: 3.9.6
  prettier-plugin-astro: 0.14.1
  tailwindcss: 4.3.3
  typescript: 6.0.3
  wrangler: 4.123.0

# Keep native toolchain packages available in local installs and Cloudflare's
# pnpm 10 build image. pnpm 11 reads allowBuilds; older pnpm reads
# onlyBuiltDependencies and ignores the newer key.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
